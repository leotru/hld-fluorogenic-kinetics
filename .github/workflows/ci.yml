name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13","3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax and metadata JSON
        run: |
          python -m compileall -q hld_model.py a1_qssa.py a2_design.py a3_ident.py fig_degeneracy.py run_all.py tests
          python -m json.tool .zenodo.json > /dev/null
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  full-reproduction:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Reproduce all analyses
        run: python run_all.py
      - name: Verify outputs
        run: |
          test -s results.txt
          test -s fig_degeneracy.pdf
          test -s fig_degeneracy.png
      - uses: actions/upload-artifact@v7
        with:
          name: reproduced-analyses
          path: |
            results.txt
            fig_degeneracy.pdf
            fig_degeneracy.png
          retention-days: 30
